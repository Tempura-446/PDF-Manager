[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-manager"
dynamic = ["version"]
description = "Command-line tool to merge, split, resize, rotate, compress and organize PDF files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=7.0",  # 6.20-7.0 harden reading broken or hostile files
    "reportlab>=4.0",
    "Pillow>=9.0",
    "cryptography>=43",  # what pypdf 7 supports (AES encryption)
    "pypdfium2>=4.0",
    "pikepdf>=8",  # qpdf: packs compressed files into object streams
    # PDF → Excel (tables.py)
    "pdfplumber>=0.11",  # finds ruled tables and the words of borderless ones
    "openpyxl>=3.1",  # writes the workbook
]

[project.optional-dependencies]
app = ["pywebview>=5"]
ocr = ["ocrmypdf>=15"]
all = ["pywebview>=5", "ocrmypdf>=15"]
build = ["pywebview>=5", "pyinstaller>=6"]
test = ["pytest>=7"]

[project.scripts]
pdfm = "pdfmanager.cli:main"

[project.gui-scripts]
pdfm-app = "pdfmanager.gui:main_app"

# pdfmanager and its folders of web files (static/, static/pdfjs/...): setuptools
# counts every folder inside a package as one too, and warns about any not listed.
[tool.setuptools.packages.find]
include = ["pdfmanager", "pdfmanager.*"]

[tool.setuptools.dynamic]
version = {attr = "pdfmanager.__version__"}

[tool.setuptools.package-data]
pdfmanager = ["gui.html", "static/*.js", "static/*.css", "static/pdfjs/**/*"]
