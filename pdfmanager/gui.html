<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Manager</title>
<link rel="stylesheet" href="/static/reader.css">
<style>
:root {
  --bg: #f5f4f0;
  --sidebar: #efeee9;
  --surface: #ffffff;
  --surface-2: #f1f0eb;
  --surface-3: #e7e6e0;
  --text: #1c1c1a;
  --muted: #6a6963;
  --faint: #9a9890;
  --border: #e0dfd8;
  --border-strong: #cfcdc4;
  --accent: #c2412b;
  --accent-hover: #a93724;
  --accent-text: #ffffff;
  --accent-soft: #f7e3dd;
  --ok: #2b7a4b;
  --ok-soft: #e2f1e7;
  --err: #b0321d;
  --err-soft: #fae2dc;
  --focus: #2b5fd9;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgb(28 28 26 / 0.06), 0 6px 20px rgb(28 28 26 / 0.05);
  --shadow-lift: 0 2px 4px rgb(28 28 26 / 0.08), 0 12px 32px rgb(28 28 26 / 0.10);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151514; --sidebar: #1a1a19; --surface: #201f1e; --surface-2: #2a2927;
    --surface-3: #34332f; --text: #edece7; --muted: #a9a8a0; --faint: #7d7c75;
    --border: #33322e; --border-strong: #46443f; --accent: #e8735a; --accent-hover: #f08a73;
    --accent-text: #1b0e0a; --accent-soft: #3b231c; --ok: #79c99a; --ok-soft: #1c3226;
    --err: #f39079; --err-soft: #3e1f19; --focus: #8fb2ff;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.3); --shadow-lift: 0 8px 28px rgb(0 0 0 / 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151514; --sidebar: #1a1a19; --surface: #201f1e; --surface-2: #2a2927;
  --surface-3: #34332f; --text: #edece7; --muted: #a9a8a0; --faint: #7d7c75;
  --border: #33322e; --border-strong: #46443f; --accent: #e8735a; --accent-hover: #f08a73;
  --accent-text: #1b0e0a; --accent-soft: #3b231c; --ok: #79c99a; --ok-soft: #1c3226;
  --err: #f39079; --err-soft: #3e1f19; --focus: #8fb2ff;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.3); --shadow-lift: 0 8px 28px rgb(0 0 0 / 0.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }

/* ---- Sidebar ---- */
nav {
  background: var(--sidebar); border-right: 1px solid var(--border);
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 20px 20px 14px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-text);
  display: grid; place-items: center; flex: none;
}
.brand-mark svg { width: 20px; height: 20px; }
.brand strong { display: block; font-size: 15.5px; letter-spacing: -0.01em; line-height: 1.2; }
.brand span { color: var(--faint); font-size: 12px; }
.search { position: relative; margin: 0 14px 6px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); width: 16px; height: 16px; }
.search input {
  width: 100%; padding: 7px 34px 7px 32px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); font-size: 14px;
}
.search kbd {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 11px/1 ui-monospace, monospace;
  color: var(--faint); border: 1px solid var(--border); border-radius: 4px; padding: 3px 5px;
}
.tools { overflow-y: auto; padding: 4px 10px 16px; flex: 1; }
.tools h2 {
  font-size: 11px; font-weight: 650; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--faint); margin: 16px 10px 4px;
}
.tools button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none;
  padding: 7px 10px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text); font-size: 14.5px;
}
.tools button svg { color: var(--muted); }
.tools button:hover { background: var(--surface-3); }
.tools button[aria-current="true"] { background: var(--surface); box-shadow: var(--shadow); font-weight: 600; }
.tools button[aria-current="true"] svg { color: var(--accent); }
.tools .none { color: var(--faint); font-size: 14px; padding: 8px 10px; }
.nav-foot { border-top: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); }
.nav-foot select { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 2px 4px; font-size: 13px; }
.mobile-picker { display: none; }

/* ---- Main ---- */
main { padding: 36px clamp(16px, 4vw, 56px) 0; width: 100%; display: flex; flex-direction: column; min-height: 100vh; }
main > * { width: 100%; max-width: 900px; }
main > .action-bar { max-width: none; width: auto; }
.page-head { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 24px; }
.tool-icon {
  width: 48px; height: 48px; border-radius: 12px; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; flex: none;
}
.tool-icon svg { width: 24px; height: 24px; stroke-width: 1.6; }
.page-head h1 { font-size: 26px; line-height: 1.2; letter-spacing: -0.02em; margin: 2px 0 4px; }
.page-head p { color: var(--muted); margin: 0; max-width: 60ch; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-head h3 { margin: 0; font-size: 14px; font-weight: 650; }
.card-head .sub { color: var(--muted); font-size: 13px; }
.link-btn { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.link-btn:hover { color: var(--text); }

/* Drop zone */
.drop {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  border: 1.5px dashed var(--border-strong); border-radius: var(--radius); padding: 36px 16px; text-align: center;
  color: var(--muted); cursor: pointer; transition: border-color .15s, background .15s;
}
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.drop input { display: none; }
.drop .drop-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--accent); margin-bottom: 4px; }
.drop .drop-icon svg { width: 22px; height: 22px; }
.drop strong { color: var(--text); font-size: 15.5px; }
.drop small { font-size: 13px; }
.drop.compact { flex-direction: row; padding: 12px 16px; gap: 10px; }
.drop.compact .drop-icon { width: 30px; height: 30px; margin: 0; }
.drop.compact .drop-icon svg { width: 16px; height: 16px; }
.drop.compact small { display: none; }

/* File cards */
.file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-bottom: 14px; }
.file-card {
  position: relative; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
  overflow: hidden; transition: box-shadow .15s, transform .15s; cursor: grab;
}
.file-card:hover { box-shadow: var(--shadow-lift); }
.file-card.dragging { opacity: .35; }
.file-card.drop-before { box-shadow: -3px 0 0 var(--accent); }
.thumb { aspect-ratio: 3 / 4; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; border-bottom: 1px solid var(--border); }
.thumb img { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }
.thumb svg { width: 34px; height: 34px; color: var(--faint); stroke-width: 1.4; }
.thumb .loading { width: 22px; height: 22px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
.file-meta { padding: 8px 10px 10px; }
.file-name { font-size: 13px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-sub { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 7px; background: var(--surface-3); color: var(--muted); }
.badge.warn { background: var(--err-soft); color: var(--err); }
.order {
  position: absolute; top: 8px; left: 8px; min-width: 22px; height: 22px; border-radius: 999px; padding: 0 6px;
  background: var(--text); color: var(--bg); font-size: 12px; font-weight: 700; display: grid; place-items: center;
}
.card-actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
.file-card:hover .card-actions, .file-card:focus-within .card-actions { opacity: 1; }
.chip-btn {
  width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
  display: grid; place-items: center; cursor: pointer; color: var(--muted); padding: 0; box-shadow: var(--shadow);
}
.chip-btn:hover { color: var(--text); background: var(--surface-2); }
.chip-btn svg { width: 15px; height: 15px; }
.chip-btn:disabled { opacity: .4; cursor: default; }
@media (hover: none) { .card-actions { opacity: 1; } }

/* Page board (Reorder pages) */
.page-board .pb-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.pb-status { color: var(--muted); font-size: 13px; }
.pb-tools { display: flex; gap: 6px; flex-wrap: wrap; }
.btn.pb-small { padding: 5px 11px; font-size: 13px; font-weight: 550; gap: 6px; }
.btn.pb-small:disabled { cursor: default; opacity: .45; }
.btn.pb-small svg { width: 14px; height: 14px; }
.pb-grid {
  position: relative; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 14px;
  max-height: min(68vh, 720px); overflow-y: auto; padding: 4px 4px 8px; margin: -4px; overscroll-behavior: contain;
}
.pb-tile {
  position: relative; border-radius: var(--radius-sm); padding: 6px 6px 4px; cursor: grab; user-select: none;
  -webkit-user-select: none; touch-action: none; outline: none; border: 1.5px solid transparent;
}
.pb-tile:hover { background: var(--surface-2); }
.pb-tile:focus-visible, .pb-tile:focus { border-color: var(--focus); background: var(--surface-2); }
.pb-thumb { aspect-ratio: 1 / 1.25; display: grid; place-items: center; }
.pb-thumb img {
  max-width: 100%; max-height: 100%; display: block; background: #fff; border-radius: 3px;
  box-shadow: 0 0 0 1px var(--border), 0 2px 6px rgb(0 0 0 / .08);
}
.pb-thumb .loading { width: 20px; height: 20px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
.pb-label { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 5px; font-variant-numeric: tabular-nums; }
.pb-tile.moved .pb-label { color: var(--accent); font-weight: 600; }
.pb-pos {
  position: absolute; top: 2px; left: 2px; min-width: 22px; height: 22px; border-radius: 999px; padding: 0 6px;
  background: var(--text); color: var(--bg); font-size: 11.5px; font-weight: 700; display: grid; place-items: center;
  font-variant-numeric: tabular-nums; z-index: 1;
}
.pb-actions { position: absolute; top: 2px; right: 2px; display: flex; flex-direction: column; gap: 3px; opacity: 0; transition: opacity .12s; z-index: 1; }
.pb-actions .chip-btn { width: 24px; height: 24px; border-radius: 6px; }
.pb-actions .chip-btn svg { width: 13px; height: 13px; }
.pb-tile:hover .pb-actions, .pb-tile:focus .pb-actions { opacity: 1; }
body.pb-dragging .pb-actions { opacity: 0 !important; }
.pb-placeholder > * { visibility: hidden; }
.pb-placeholder { border: 1.5px dashed var(--accent); background: var(--accent-soft) !important; }
.pb-ghost {
  position: fixed; top: 0; left: 0; z-index: 1000; pointer-events: none; background: var(--surface);
  box-shadow: var(--shadow-lift); border-color: var(--accent); opacity: .95;
}
.pb-ghost .pb-actions { display: none; }
body.pb-dragging, body.pb-dragging * { cursor: grabbing !important; }
.pb-message { color: var(--muted); font-size: 14px; padding: 6px 0; }
.page-board[data-state="password"] .pb-message, .page-board[data-state="wrong-password"] .pb-message, .page-board[data-state="error"] .pb-message { color: var(--err); }
.pb-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.pb-hint { color: var(--muted); font-size: 12.5px; margin: 10px 0 0; }
.pb-hint:empty { display: none; }
/* recipe builder */
.recipe-builder .pb-toolbar { align-items: center; }
.rc-picker, .rc-add, .rc-name { padding: 6px 9px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); font-size: 14px; }
.rc-picker { min-width: 200px; }
.rc-name { width: 190px; }
.rc-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; counter-reset: step; }
.rc-step { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; background: var(--surface); position: relative; }
.rc-step + .rc-step::before { content: ""; position: absolute; left: 22px; top: -11px; height: 10px; border-left: 2px solid var(--border-strong); }
.rc-head { display: flex; align-items: center; gap: 10px; }
.rc-head strong { font-size: 14px; }
.rc-num { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-text); font-size: 12px; font-weight: 700; display: grid; place-items: center; flex: none; }
.rc-actions { margin-left: auto; display: flex; gap: 4px; }
.rc-actions .chip-btn { box-shadow: none; }
.rc-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 14px; margin-top: 10px; padding-left: 32px; }
.rc-fields .field label { font-size: 12.5px; }
.rc-fields .field.check { padding-bottom: 4px; }
.rc-fields .field input[type=text], .rc-fields .field input[type=number], .rc-fields .field select { padding: 6px 9px; }
.rc-footer { margin-top: 12px; }
.rc-starters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rc-starters-label { color: var(--muted); font-size: 13px; }
/* region editor (crop, redact) */
.region-editor .pb-toolbar { margin-bottom: 10px; }
.re-nav { display: flex; align-items: center; gap: 6px; }
.re-nav .chip-btn { box-shadow: none; }
.re-page-label { font-size: 13px; font-weight: 600; min-width: 92px; text-align: center; font-variant-numeric: tabular-nums; }
.re-stage { position: relative; margin: 0 auto; box-shadow: 0 0 0 1px var(--border), 0 4px 18px rgb(0 0 0 / .12); background: #fff; }
.re-canvas { display: block; }
.re-overlay { position: absolute; inset: 0; overflow: hidden; cursor: crosshair; touch-action: none; outline: none; }
.region-editor[data-mode="crop"] .re-overlay { cursor: default; }
.re-overlay:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); }
.re-rect { position: absolute; box-sizing: border-box; }
.re-crop { border: 2px solid var(--accent); box-shadow: 0 0 0 9999px rgb(20 20 18 / .5); cursor: move; }
.re-box { background: #000; cursor: move; }
.re-box.selected { outline: 2px solid var(--focus); outline-offset: 1px; }
.re-match { position: absolute; background: repeating-linear-gradient(-45deg, rgb(0 0 0 / .75) 0 5px, rgb(0 0 0 / .45) 5px 10px); outline: 1px solid #000; pointer-events: none; }
.re-handle { position: absolute; width: 12px; height: 12px; background: #fff; border: 2px solid var(--accent); border-radius: 3px; }
.re-box .re-handle { border-color: var(--focus); }
.re-n, .re-s { left: calc(50% - 6px); cursor: ns-resize; } .re-n { top: -7px; } .re-s { bottom: -7px; }
.re-e, .re-w { top: calc(50% - 6px); cursor: ew-resize; } .re-e { right: -7px; } .re-w { left: -7px; }
.re-ne { top: -7px; right: -7px; cursor: nesw-resize; } .re-sw { bottom: -7px; left: -7px; cursor: nesw-resize; }
.re-nw { top: -7px; left: -7px; cursor: nwse-resize; } .re-se { bottom: -7px; right: -7px; cursor: nwse-resize; }
.re-delete { position: absolute; top: -12px; right: -34px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--err); color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
.re-delete svg { width: 13px; height: 13px; stroke-width: 2.4; }
#panel-card.muted #panel-host { opacity: .45; pointer-events: none; }
/* bookmark editor */
.bm-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: min(60vh, 640px); overflow-y: auto; }
.bm-row { display: flex; align-items: center; gap: 8px; padding-left: calc(var(--level, 0) * 26px); }
.bm-row::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--accent); opacity: calc(1 - var(--level, 0) * .25); flex: none; }
.bm-title { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); }
.bm-page-wrap { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13px; }
.bm-page { width: 68px; padding: 7px 8px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); }
.bm-title:focus, .bm-page:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 20%, transparent); }
.bm-actions { display: flex; gap: 3px; }
.bm-actions .chip-btn { box-shadow: none; }
@media (max-width: 760px) { .bm-row { flex-wrap: wrap; } .bm-title { flex-basis: 100%; } }
/* select mode (extract, delete, rotate) */
.page-board[data-mode="select"] .pb-tile, .page-board[data-mode="view"] .pb-tile { cursor: pointer; touch-action: auto; }
.page-board[data-mode="view"] .pb-tile { cursor: default; }
.page-board:not([data-mode="order"]) .pb-actions { display: none; }
.pb-check {
  position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border-radius: 999px; z-index: 1;
  display: none; place-items: center; background: var(--surface); border: 1.5px solid var(--border-strong); color: transparent;
}
.pb-check svg { width: 13px; height: 13px; stroke-width: 2.6; }
.page-board[data-mode="select"] .pb-check { display: grid; }
.page-board[data-mode="select"] .pb-tile:hover .pb-check { border-color: var(--accent); }
.pb-tile.picked { border-color: var(--accent); background: var(--accent-soft); }
.pb-tile.picked:hover, .pb-tile.picked:focus { background: var(--accent-soft); }
.pb-tile.picked .pb-check { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.pb-tile.picked .pb-label { color: var(--accent); font-weight: 600; }
.page-board[data-mode="select"] .pb-pos { background: var(--surface-3); color: var(--muted); }
/* extract: pages that are not picked stay behind */
.page-board[data-effect="keep"].has-picked .pb-tile:not(.picked) .pb-thumb img { opacity: .4; }
/* delete: picked pages are crossed out */
.page-board[data-effect="remove"] .pb-tile.picked { border-color: var(--err); background: var(--err-soft); }
.page-board[data-effect="remove"] .pb-tile.picked .pb-check { background: var(--err); border-color: var(--err); }
.page-board[data-effect="remove"] .pb-tile.picked .pb-label { color: var(--err); text-decoration: line-through; }
.page-board[data-effect="remove"] .pb-tile.picked .pb-thumb img { opacity: .35; filter: grayscale(1); }
.page-board.pb-warn .pb-status { color: var(--err); }
/* rotate: picked pages are shown turned */
.pb-thumb img { transition: transform .2s ease; }
.pb-tile.turned .pb-thumb img { transform: rotate(var(--pb-turn, 90deg)) scale(var(--pb-fit, .8)); }
@media (prefers-reduced-motion: reduce) { .pb-thumb img { transition: none; } }
.pb-tile:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
/* split mode */
.page-board[data-mode="split"] .pb-tile { cursor: pointer; touch-action: auto; background: var(--file-tint); border-radius: 0; }
.page-board[data-mode="split"] .pb-tile:hover { background: var(--accent-soft); }
.page-board[data-mode="split"] .pb-pos { background: var(--surface-3); color: var(--muted); }
.page-board[data-mode="split"] .pb-tile.split-start::before {
  content: ""; position: absolute; left: -9px; top: 4px; bottom: 4px; width: 4px; border-radius: 4px; background: var(--accent);
}
.pb-file { position: absolute; top: 4px; right: 4px; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--surface); border-radius: 999px; padding: 1px 7px; box-shadow: var(--shadow); z-index: 1; }
.pb-file:empty { display: none; }
@media (hover: none) { .pb-actions { opacity: 1; } }
@media (pointer: coarse) { .pb-tile { touch-action: auto; } }

/* Options */
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px 18px; }
.field label { display: block; font-size: 13px; font-weight: 550; margin-bottom: 5px; }
.field .hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.field input[type=text], .field input[type=number], .field input[type=password], .field select, .pw-row input {
  width: 100%; padding: 9px 11px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface);
}
.field input:focus, .field select:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 20%, transparent); }
.field .with-btn { display: flex; gap: 6px; }
.field .with-btn input { flex: 1; min-width: 0; }
.field input[type=file] { font-size: 13px; max-width: 100%; }
.field.check { display: flex; align-items: center; gap: 9px; align-self: end; padding-bottom: 9px; }
.field.check label { margin: 0; font-weight: 400; font-size: 14.5px; cursor: pointer; }
.field.check input { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
.field.wide { grid-column: 1 / -1; }
.empty-note { color: var(--muted); margin: 0; font-size: 14px; }
details.pw { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
details.pw summary { cursor: pointer; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 6px; list-style: none; }
details.pw summary::-webkit-details-marker { display: none; }
details.pw summary svg { width: 15px; height: 15px; }
.pw-row { margin-top: 10px; max-width: 340px; }
.pw-row .hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; border-radius: var(--radius-sm);
  padding: 9px 18px; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--accent-text); white-space: nowrap;
}
.btn:hover { background: var(--accent-hover); }
.btn.secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn.secondary:hover { background: var(--surface-2); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn svg { width: 16px; height: 16px; }
.btn .spinner { display: none; width: 15px; height: 15px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
.btn.busy .spinner { display: inline-block; }
.btn.busy .btn-icon { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Action bar */
.action-bar {
  position: sticky; bottom: 0; margin: auto calc(-1 * clamp(16px, 4vw, 56px)) 0; padding: 14px clamp(16px, 4vw, 56px);
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-top: 1px solid var(--border);
}
.action-inner { max-width: 900px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.action-bar .summary { color: var(--muted); font-size: 14px; }
.action-bar .buttons { display: flex; gap: 10px; margin-left: auto; }
.spacer { flex: 1; min-height: 24px; }

/* Messages and results */
.message { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-sm); font-size: 14px; margin-bottom: 16px; }
.message svg { margin-top: 1px; }
.message.err { background: var(--err-soft); color: var(--err); }
.message.info { background: var(--surface-2); color: var(--muted); }
.result { display: flex; gap: 18px; align-items: center; border-color: color-mix(in srgb, var(--ok) 35%, var(--border)); }
.result .thumb { width: 96px; flex: none; border: 1px solid var(--border); border-radius: var(--radius-sm); }
.result-body { flex: 1; min-width: 0; }
.result-title { display: flex; align-items: center; gap: 8px; color: var(--ok); font-weight: 650; font-size: 14px; }
.result-name { font-size: 16px; font-weight: 600; margin: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result-sub { color: var(--muted); font-size: 13.5px; }
.result-sub .saving { color: var(--ok); font-weight: 600; }
.result-note { font-size: 13.5px; margin-top: 6px; }
.result-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
td { word-break: break-all; }

/* Reader mode: the reader fills the main area. */
#reader-host { display: none; }
body.reader-mode .app { height: 100vh; height: 100dvh; }
body.reader-mode main { padding: 0; min-height: 0; height: 100%; overflow: hidden; }
body.reader-mode main > :not(#reader-host) { display: none !important; }
body.reader-mode #reader-host { display: block; flex: 1; min-height: 0; max-width: none; }
.reader-loading { display: grid; place-items: center; height: 100%; color: var(--muted); }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; align-content: start; }
  body.reader-mode .app { grid-template-rows: auto minmax(0, 1fr); align-content: stretch; }
  nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
  .tools, .search, .nav-foot { display: none; }
  .brand { padding: 14px 16px 10px; }
  .mobile-picker { display: block; margin: 0 16px; width: calc(100% - 32px); padding: 9px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); }
  main { padding: 22px 16px 0; min-height: 0; }
  .action-bar { margin: auto -16px 0; padding: 12px 16px; }
  .fields { grid-template-columns: 1fr; }
  .file-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .pb-grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .result { flex-direction: column; align-items: flex-start; }
  .tool-icon { width: 40px; height: 40px; }
  .kbd-hint { display: none; }
}
</style>

    <section class="card" id="panel-card" hidden>
      <div class="card-head">

    <div class="spacer"></div>

    <div id="reader-host"></div>

    <div class="action-bar"><div class="action-inner">
      <span class="summary"><span id="summary"></span><span class="kbd-hint" id="kbd-hint"></span></span>
      <div class="buttons">
        <button class="btn secondary" id="preview" type="button" hidden><span class="spinner"></span>Preview</button>
        <button class="btn" id="run" type="button">
          <span class="spinner"></span>
          <svg class="i btn-icon" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>

      </div>
    </div></div>
  </main>
</div>

<script>
"use strict";
const token = new URLSearchParams(location.hash.slice(1)).get("token") || "";
const $ = (id) => document.getElementById(id);
let ops = [], current = null, items = [], lastUrl = null;
const isDesktop = () => !!(window.pywebview && window.pywebview.api);
const isMac = /Mac/.test(navigator.platform);

// ---- icons ----------------------------------------------------------------
const ICONS = {

  text: '<path d="M4 6h16M4 12h16M4 18h10"/>',

  sanitize: '<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',

  "to-word": '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="m8 11 1.5 6 2.5-4 2.5 4 1.5-6"/>',
  "from-office": '<rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><path d="M17 14v6M14 17l3 3 3-3"/>',

  rename: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13 7 4 4"/>',
  duplicates: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',

  left: '<path d="m15 18-6-6 6-6"/>', right: '<path d="m9 18 6-6-6-6"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>',

  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',

function icon(name, cls = "i") {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", cls); s.setAttribute("aria-hidden", "true");
  s.innerHTML = ICONS[name] || ICONS.file;

// ---- theme ----------------------------------------------------------------
function applyTheme(v) { if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme; }
try { const t = localStorage.getItem("pdfm-theme") || ""; $("theme").value = t; applyTheme(t); } catch (e) {}

// ---- helpers --------------------------------------------------------------
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v === true) node.setAttribute(k, "");
    else if (v !== false && v != null) node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}
function humanSize(n) {
  const u = ["B", "KB", "MB", "GB"]; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i ? n.toFixed(1) : n) + " " + u[i];
}
function plural(n, word) { return `${n} ${word}${n === 1 ? "" : "s"}`; }

function clearMessages() { $("error").hidden = true; $("result").hidden = true; $("result-table").hidden = true; }
async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { "X-Pdfm-Token": token, ...(options.headers || {}) } });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || res.statusText); }
  return res;
}

// ---- tools -----------------------------------------------------------------
async function load() {
  if (!token) { showError("Open PDF Manager with the link printed in the terminal (it contains a security token)."); return; }
  let data;
  try { data = await (await api("/api/operations")).json(); }
  catch (e) { showError("Could not connect. Restart PDF Manager and use the new link."); return; }
  ops = data.operations;
  $("version").textContent = "Version " + data.version;
  renderTools("");
  const groups = {};
  for (const op of ops) (groups[op.group] ||= []).push(op);
  for (const [name, list] of Object.entries(groups)) {
    const og = el("optgroup", { label: name });
    for (const op of list) og.append(el("option", { value: op.id }, op.label));
    $("picker").append(og);
  }
  $("picker").addEventListener("change", (e) => select(e.target.value));
  const openIds = (new URLSearchParams(location.hash.slice(1)).get("open") || "").split(",").filter(Boolean);
  if (openIds.length) {
    await select("reader");
    reader.openById(openIds[0]);
    return;
  }
  let start = "merge";
  try { start = localStorage.getItem("pdfm-op") || start; } catch (e) {}
  select(ops.some((o) => o.id === start) ? start : ops[0].id);
  // Load the reader and the PDF engine in the background once the app is
  // idle, so opening a PDF later doesn't wait for them.
  const warmUp = () => import("/static/reader.js").then((m) => m.loadPdfjs()).catch(() => {});
  if (window.requestIdleCallback) requestIdleCallback(warmUp, { timeout: 2000 }); else setTimeout(warmUp, 1000);
}

// ---- reader -----------------------------------------------------------------
let reader = null;
async function ensureReader() {
  if (reader) return reader;
  const host = $("reader-host");
  host.replaceChildren(el("div", { class: "reader-loading" }, "Loading the reader…"));
  const { Reader } = await import("/static/reader.js");
  host.replaceChildren();
  reader = new Reader(host, {
    token, isDesktop, api: () => (window.pywebview ? window.pywebview.api : null),
    tools: ops.filter((o) => o.files === "pdf").map((o) => [o.id, o.label]),
    onEdit: (toolId, file, password) => {
      select(toolId);
      items = [];
      if (password) { $("pw").value = password; $("pw-box").open = true; }
      addFiles([file]);
    },
  });
  return reader;
}
const inReader = () => current && current.files === "reader";
async function openInReader(file) {
  await select("reader");
  reader.openFile(file, $("pw").value || null);  // the password typed for the tools, if any
}

function renderTools(query) {
  const q = query.trim().toLowerCase();
  const box = $("tools");
  box.replaceChildren();
  let group = null, shown = 0;
  for (const op of ops) {
    const hay = (op.label + " " + op.group + " " + (op.help || "") + " " + op.id).toLowerCase();
    if (q && !hay.includes(q)) continue;
    if (op.group !== group) { group = op.group; box.append(el("h2", {}, group)); }
    box.append(el("button", { type: "button", "data-op": op.id, "aria-current": current && current.id === op.id ? "true" : "false",
      onclick: () => select(op.id) }, icon(op.id), el("span", {}, op.label)));
    shown++;
  }
  if (!shown) box.append(el("div", { class: "none" }, "No matching tools"));

$("search").addEventListener("input", (e) => renderTools(e.target.value));

function defaultHelp(op) { return op.files === "pdf" ? "Add one or more PDFs. Several files come back together as a ZIP." : ""; }

// ---- files -------------------------------------------------------------------
function addFiles(list) {
  const want = accepts(current.files);
  const accepted = [...list].filter(want), rejected = list.length - accepted.length;
  for (const file of accepted) {
    const it = { file, id: Math.random().toString(36).slice(2), pages: null, thumb: null, locked: false, loading: true };
    items.push(it);
    if (isImage(file)) { it.thumb = URL.createObjectURL(file); it.loading = false; }
    else if (!isPdf(file)) it.loading = false;  // Office files: no preview
    else inspect(it);
  }
  renderFiles();
  clearMessages();
  if (rejected) showError(`${plural(rejected, "file")} skipped — only ${{ images: "images", office: "Word, Excel, PowerPoint, OpenDocument, RTF or text files" }[current.files] || "PDFs"} can be used here.`);
}

async function inspect(it) {
  it.loading = true;
  const body = new FormData();
  body.append("file", it.file, it.file.name);
  body.append("password", $("pw").value);
  try {
    const info = await (await api("/api/inspect", { method: "POST", body })).json();
    Object.assign(it, { pages: info.pages, thumb: info.thumb, locked: info.locked, error: info.error });
  } catch (e) { it.error = e.message; }
  it.loading = false;
  renderFiles();
}

let pwTimer = null;
$("pw").addEventListener("input", () => {

    sub.append(el("span", {}, humanSize(it.file.size)));

      thumb,

// ---- page board (the page tools) ---------------------------------------------------
// With one PDF, the page tools show every page (see static/pages.js and the

let board = null, boardLib = null;
const BOARD_TEXT = {
  order: ["Drag pages into the new order", "Tip: click a page, then use the arrow keys to pick and Alt+arrow keys to move it. Delete removes a page, D duplicates it, Ctrl+Z undoes."],
  keep: ["Click the pages to extract", "Shift+click selects a range. With the keyboard: arrow keys, then Space to select; Ctrl+A selects all."],
  remove: ["Click the pages to delete", "Shift+click selects a range. With the keyboard: arrow keys, then Space to select; Ctrl+A selects all."],
  rotate: ["Click the pages to rotate", "The previews show the result. Shift+click selects a range; with no page selected, every page is rotated."],
  reverse: ["Preview of the result", ""],
  split: ["Click a page to start a new file there", "Each colour band becomes one file. With the keyboard: arrow keys, then Space."],

// Split: pages that start a new file (0-based) <-> "1-3 4-7 8-12".
function splitsToRanges(starts, total) {
  const firsts = [0, ...starts], parts = [];
  firsts.forEach((a, i) => { const b = (firsts[i + 1] ?? total) - 1; parts.push(a === b ? `${a + 1}` : `${a + 1}-${b + 1}`); });
  return parts.join(" ");
}

  const flat = groups.flat();
  if (flat.length !== total || flat.some((p, i) => p !== i)) return null;  // must cover every page once, in order
  return groups.slice(1).map((g) => g[0]);
}
async function syncBoard() {

  const active = !!spec && items.length > 0;
  $("pages-card").hidden = !active;
  if (!active || items.length > 1) {
    $("pages-sub").textContent = "";
    $("pages-hint").textContent = active ? "Page previews are shown for one file at a time. With several files, the pages typed under Options are used for each of them." : "";
    if (board) board.close();
    return;
  }
  const [sub, hint] = BOARD_TEXT[spec.effect || spec.mode];
  $("pages-sub").textContent = sub;
  $("pages-hint").textContent = hint;
  if (!boardLib) boardLib = await import("/static/pages.js");
  if (!board) board = new boardLib.PageBoard($("page-board"), { onChange: boardChanged });
  if (board.mode !== spec.mode || board.effect !== (spec.effect || null) || board.tool !== current.id) {
    board.tool = current.id;
    board.configure({ mode: spec.mode, effect: spec.effect || null });
  }
  const it = items[0];
  const result = await board.load(it.file, $("pw").value || null);
  if (result === "password" || result === "wrong-password") $("pw-box").open = true;
  if (result !== "ok" || board.file !== it.file || current.board !== spec) return;
  if (spec.degrees) board.setRotation($("f-" + spec.degrees).value);
  const f = boardField();
  if (!f) return;
  if (spec.mode === "split") {

    board.setSplits(typed || [...Array(board.total).keys()].filter((p) => p > 0 && p % every === 0));

$("form").addEventListener("input", (e) => {
  const spec = current && current.board;

  if (spec.degrees && e.target.id === "f-" + spec.degrees) board.setRotation(e.target.value);
  if (spec.every && e.target.id === "f-" + spec.every) {
    const every = Math.max(1, Number(e.target.value) || 1);
    board.setSplits([...Array(board.total).keys()].filter((p) => p > 0 && p % every === 0));

  }
  if (spec.mode === "split" && e.target.id === "f-" + spec.field) {
    const starts = rangesToSplits(e.target.value, board.total);
    if (starts) board.setSplits(starts);
    return;
  }
  if (e.target.id !== "f-" + spec.field) return;
  const pages = boardLib.parseRanges(e.target.value, board.total);

    let control = input;
    if (PATH_FIELDS.has(f.key) && isDesktop()) {
      control = el("div", { class: "with-btn" }, input, el("button", { class: "btn secondary", type: "button", onclick: async () => {
        const chosen = await window.pywebview.api.pick_folder();
        if (chosen) { input.value = chosen; input.dispatchEvent(new Event("input", { bubbles: true })); }
      } }, "Browse…"));
    }
    const wide = PATH_FIELDS.has(f.key) || (f.hint && f.hint.length > 60);
    const wrap = f.kind === "check"
      ? el("div", { class: "field check", "data-key": f.key }, input, el("label", { for: id }, f.label))
      : el("div", { class: "field" + (wide ? " wide" : ""), "data-key": f.key }, el("label", { for: id }, f.label), control);
    if (f.hint) wrap.append(el("div", { class: "hint" }, f.hint));
    form.append(wrap);
  }
  updateVisibility();
}
$("form").addEventListener("input", updateVisibility);
$("form").addEventListener("submit", (e) => { e.preventDefault(); run(false); });
function updateVisibility() {
  for (const f of current.fields) {
    if (!f.show_if) continue;
    const ok = Object.entries(f.show_if).every(([k, v]) => $("f-" + k).value === v);
    document.querySelector(`.field[data-key="${f.key}"]`).hidden = !ok;
  }
}
function collectOptions() {
  const opts = {}, extra = {};
  for (const f of current.fields) {
    const input = $("f-" + f.key);
    if (f.kind === "check") opts[f.key] = input.checked ? "true" : "false";
    else if (f.kind === "file") { if (input.files[0]) extra[f.key] = input.files[0]; }
    else opts[f.key] = input.value;
  }
  return { opts, extra };
}
function missingField() {
  const f = current.fields.find((f) => f.required && !$("f-" + f.key).value.trim());
  if (f) { showError(`Please fill in “${f.label}”.`); $("f-" + f.key).focus(); }
  return !!f;
}

// ---- running -------------------------------------------------------------------
async function run(preview) {
  clearMessages();
  if (current.files === null) return runFolder(!preview);
  const need = current.files === "pdf2" ? 2 : current.min || 1;
  if (items.length < need) { showError(need === 1 ? "Add a file first." : `Add ${current.files === "pdf2" ? "exactly 2" : "at least " + need} files.`); return; }
  if (missingField()) return;
  const { opts, extra } = collectOptions();
  const body = new FormData();
  body.append("op", current.id);
  body.append("password", $("pw").value);
  for (const [k, v] of Object.entries(opts)) body.append(k, v);
  for (const [k, v] of Object.entries(extra)) body.append(k, v, v.name);
  for (const it of items) body.append("files", it.file, it.file.name);
  busy(true, current.id === "ocr" ? "Recognising text — this can take a while…" : "Working…");
  try {
    const res = await api("/api/run", { method: "POST", body, headers: isDesktop() ? { "X-Pdfm-Keep": "1" } : {} });
    const name = res.headers.get("X-Pdfm-Filename") || "result.pdf";
    const resultId = res.headers.get("X-Pdfm-Result-Id");
    const note = decodeURIComponent(res.headers.get("X-Pdfm-Note") || "");
    const blob = await res.blob();
    await showResult(name, blob, resultId, note);
  } catch (err) {
    showError(err.message);
  } finally { busy(false); }
}

async function showResult(name, blob, resultId, note = "") {
  if (lastUrl) URL.revokeObjectURL(lastUrl);
  lastUrl = URL.createObjectURL(blob);
  const before = items.reduce((n, it) => n + it.file.size, 0);
  let sub = humanSize(blob.size);
  if (current.id === "compress") {
    const pct = (1 - blob.size / before) * 100;
    sub = `${humanSize(before)} → ${humanSize(blob.size)} · ` + (pct <= 0 ? "already compact" : (pct > 99 ? pct.toFixed(1) : Math.round(pct)) + "% smaller");
  }
  const thumb = el("div", { class: "thumb" }, icon(/\.zip$/i.test(name) ? "zip" : "file"));
  const subEl = el("div", { class: "result-sub" }, sub);
  const actions = el("div", { class: "result-actions" });
  if (isDesktop() && resultId) {
    const save = el("button", { class: "btn", type: "button" }, icon("download"), "Save…");
    save.addEventListener("click", async () => {
      try {
        const path = await window.pywebview.api.save_result(resultId, name);
        if (!path) return;
        subEl.replaceChildren(el("span", { class: "saving" }, "Saved"), ` to ${path}`);
        if (!actions.querySelector("[data-reveal]")) save.after(el("button", { class: "btn secondary", type: "button", "data-reveal": "" }, icon("folder"), "Show in folder"));
        actions.querySelector("[data-reveal]").onclick = () => window.pywebview.api.reveal(path);
      } catch (e) { showError(String(e.message || e)); }
    });
    actions.append(save);
  } else {
    actions.append(el("a", { class: "btn", href: lastUrl, download: name }, icon("download"), "Download"));
  }
  if (/\.pdf$/i.test(name)) {
    actions.append(el("button", { class: "btn secondary", type: "button", onclick: () => openInReader(new File([blob], name, { type: "application/pdf" })) }, icon("reader"), "Open in reader"));
  }
  $("result").replaceChildren(thumb,
    el("div", { class: "result-body" },
      el("div", { class: "result-title" }, icon("check"), "Done"),
      el("div", { class: "result-name" }, name), subEl,
      note ? el("div", { class: "result-note" }, ...note.split("\n").map((line) => el("div", {}, line))) : null, actions));
  $("result").hidden = false;
  $("result").scrollIntoView({ behavior: "smooth", block: "nearest" });
  if (!isDesktop()) actions.querySelector("a").click();
  if (/\.pdf$/i.test(name)) {
    const body = new FormData();
    body.append("file", blob, name);
    body.append("password", $("pw").value);
    try {
      const info = await (await api("/api/inspect", { method: "POST", body })).json();
      if (info.thumb) thumb.replaceChildren(el("img", { src: info.thumb, alt: "Preview of the result" }));
      if (info.pages != null) subEl.prepend(plural(info.pages, "page") + " · ");
    } catch (e) { /* preview is optional */ }
  }
}

async function runFolder(apply) {
  if (missingField()) return;
  const { opts } = collectOptions();
  if (apply && (opts.move === "true" || opts.delete === "true" || current.id === "rename")) {
    const verb = current.id === "rename" ? "rename files" : opts.delete === "true" ? "delete duplicate files" : "move files";
    if (!confirm(`This will ${verb} on your computer. Continue?`)) return;
  }
  busy(true, apply ? "Applying…" : "Previewing…", apply ? "run" : "preview");
  try {
    const data = await (await api("/api/folder", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ op: current.id, options: opts, apply }) })).json();
    const n = data.rows.length;
    const msg = n === 0 ? "Nothing to do — everything is already in order."
      : apply ? `${plural(n, "file")} handled.` : `${plural(n, "file")} would change. Nothing has changed yet — click Apply to do it.`;
    $("result").replaceChildren(el("div", { class: "result-body" }, el("div", { class: "result-title" }, icon(apply ? "check" : "alert"), apply ? "Done" : "Preview"), el("div", { class: "result-sub" }, msg)));
    $("result").hidden = false;
    if (n) {
      const table = el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "File"), el("th", {}, apply ? "Result" : "Will become"))));
      const tbody = el("tbody");
      for (const [a, b] of data.rows) tbody.append(el("tr", {}, el("td", {}, a), el("td", {}, b)));
      table.append(tbody);
      $("result-table").replaceChildren(table);
      $("result-table").hidden = false;
    }
  } catch (err) { showError(err.message); } finally { busy(false); }
}

function busy(on, text, which = "run") {
  for (const id of ["run", "preview"]) { $(id).disabled = on; $(id).classList.toggle("busy", on && id === which); }
  if (on) { $("summary").textContent = text; $("kbd-hint").textContent = ""; } else updateSummary();
}
$("run").addEventListener("click", () => run(false));
$("preview").addEventListener("click", () => run(true));

// Tell the server the page is still open; it shuts down some time after the
// last window running the app has closed.
const ping = () => { if (token) api("/api/ping", { method: "POST" }).catch(() => {}); };
setInterval(ping, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) ping(); });

// In the desktop window, re-render once pywebview's API is ready (adds Browse… buttons).
window.addEventListener("pywebviewready", () => { if (current) renderForm(); });
load();
</script>
</body>
</html>
