name: Publish release

# Builds and publishes the current version in pdfmanager/__init__.py to
# Tempura-446/ZPDF-releases using packaging/release.py, and tags this
# repository with v<version>.
#
# One-time setup: add a repository secret named RELEASES_TOKEN (Settings >
# Secrets and variables > Actions > Secrets) containing a fine-grained PAT
# with "Contents: Read and write" access to Tempura-446/ZPDF-releases.
# (Dry runs work without RELEASES_TOKEN.)
on:
  workflow_dispatch:
    inputs:
      skip_checks:
        description: "Skip tests, PyInstaller build, and self-test (use when CI already passed)"
        type: boolean
        default: false
      dry_run:
        description: "Build release files and upload as artifact without publishing or tagging"
        type: boolean
        default: false
      trigger_post_release:
        description: "Trigger build-app.yml and lock.yml after publishing"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Release (Windows, Python 3.13)
    runs-on: windows-latest
    steps:
      - name: Check RELEASES_TOKEN secret
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if (-not $env:RELEASES_TOKEN) {
            Write-Error "Missing repository secret RELEASES_TOKEN. Add a fine-grained PAT with Contents: Read and write on Tempura-446/ZPDF-releases in Settings > Secrets and variables > Actions."
            exit 1
          }

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          $extras = if ("${{ inputs.skip_checks }}" -eq "true") { "app,ocr,translate" } else { "build,test" }
          python -m pip install --disable-pip-version-check -e ".[$extras]"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run packaging/release.py
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $args = @("packaging/release.py")
          if ("${{ inputs.skip_checks }}" -eq "true") { $args += "--skip-checks" }
          if ("${{ inputs.dry_run }}" -eq "true") { $args += "--dry-run" }
          python @args
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Trigger build-app and lock workflows
        if: ${{ !inputs.dry_run && inputs.trigger_post_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import pdfmanager; print(pdfmanager.__version__)"
          $tag = "v$($version.Trim())"
          gh workflow run build-app.yml --ref $tag
          gh workflow run lock.yml --ref $tag

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-files
          path: dist/release/*
          if-no-files-found: ignore
          retention-days: 14
