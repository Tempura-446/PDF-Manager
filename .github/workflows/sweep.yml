name: Weekly sweep

# Every tool on a small made-up corpus of PDFs of every kind (valid and
# damaged), each run in a process of its own with a time and memory limit
# (tests/sweep). Fails only when a run crashed, hung, ran out of memory or
# died; a tool refusing a file with a message is fine. The report
# (summary.txt, results.csv, tracebacks.txt) is kept as an artifact.
#
# Not run on pull requests and not a required check: it watches for
# regressions the regular tests don't reach. Run it by hand from the
# Actions tab; tick "reader" to also open some of the files in the reader
# (that installs Playwright for Node.js and its browser).
on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays, 03:17 UTC
  workflow_dispatch:
    inputs:
      reader:
        description: "Also open 15 of the files in the reader (installs Playwright)"
        type: boolean
        default: false

concurrency:
  group: sweep
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sweep:
    name: Sweep (quick corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        # (python-docx and python-pptx only to check the Word and PowerPoint results)
        run: python -m pip install -e ".[test]" python-docx python-pptx
      - name: Install Playwright for Node.js (reader part)
        id: playwright
        if: inputs.reader
        continue-on-error: true
        working-directory: tests/sweep
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      # Ubuntu 24.04 blocks the sandbox Chrome starts in (user namespaces):
      # let the browser use its sandbox (only on this machine).
      - name: Let the browser use its sandbox (Linux)
        if: inputs.reader && steps.playwright.outcome == 'success'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          for helper in /opt/microsoft/msedge/msedge-sandbox /opt/google/chrome/chrome-sandbox; do
            if [ -f "$helper" ]; then sudo chown root:root "$helper" && sudo chmod 4755 "$helper"; fi
          done
      - name: Make the corpus
        run: python tests/sweep/make_corpus.py "$RUNNER_TEMP/corpus" --quick 60
      - name: Run the sweep
        env:
          READER: ${{ (inputs.reader && steps.playwright.outcome == 'success') && '15' || '0' }}
        run: >
          python -m pytest -q -p no:cacheprovider tests/sweep
          --sweep "$RUNNER_TEMP/corpus" --sweep-out "$RUNNER_TEMP/sweep-report" --sweep-reader "$READER"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sweep-report
          path: |
            ${{ runner.temp }}/sweep-report/summary.txt
            ${{ runner.temp }}/sweep-report/results.csv
            ${{ runner.temp }}/sweep-report/tracebacks.txt
          retention-days: 14
          if-no-files-found: warn
