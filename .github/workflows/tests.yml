name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q

  ocr:
    name: OCR, PDF/A and Office (Tesseract, Ghostscript, LibreOffice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract, Ghostscript and LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr ghostscript libreoffice-writer-nogui
      - name: Install
        run: python -m pip install -e ".[test,ocr]"
      - name: Run the tests that need these programs
        run: python -m pytest -q -rs tests/test_features.py -k "upright or pdfa or libreoffice or ocr" && python -m pytest -q -k ocr
