name: Tests

# With the repository variable PC_RUNNER set to "true" (Settings > Secrets
# and variables > Actions > Variables), the tests run on the owner's own
# Windows PC (a self-hosted runner labelled "zpdf", see docs/pc-runner.md)
# and the jobs that need GitHub's machines are skipped. Without it, they run
# on GitHub's machines as before.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    if: vars.PC_RUNNER != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q

  ocr:
    name: OCR, PDF/A and Office (Tesseract, Ghostscript, LibreOffice)
    if: vars.PC_RUNNER != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract, Ghostscript and LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr ghostscript libreoffice-writer-nogui
      - name: Install
        run: python -m pip install -e ".[test,ocr,tesseract]"
      - name: Run the tests that need these programs
        run: python -m pytest -q -rs tests/test_features.py -k "upright or pdfa or libreoffice or ocr" && python -m pytest -q -k ocr

  # On the owner's PC: the whole suite in a fresh virtual environment, so the
  # PC's own Python and its packages are left as they are.
  pc:
    name: Windows PC / tests
    if: vars.PC_RUNNER == 'true'
    runs-on: [self-hosted, Windows, zpdf]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Make a fresh environment
        shell: powershell
        run: |
          if (Get-Command py -ErrorAction SilentlyContinue) { py -3 -m venv "$env:RUNNER_TEMP\venv" }
          else { python -m venv "$env:RUNNER_TEMP\venv" }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:RUNNER_TEMP\venv\Scripts\python.exe" --version
      - name: Install
        shell: powershell
        run: |
          & "$env:RUNNER_TEMP\venv\Scripts\python.exe" -m pip install --disable-pip-version-check -q -e ".[test]"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Run tests
        shell: powershell
        run: |
          & "$env:RUNNER_TEMP\venv\Scripts\python.exe" -m pytest -q -p no:cacheprovider
          if ($LASTEXITCODE -ne 0) { exit 1 }
