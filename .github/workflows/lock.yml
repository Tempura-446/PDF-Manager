name: Lock the installer's packages

# Makes packaging/windows/requirements-lock.txt (packaging/lock.py) on
# Windows with Python 3.13, the Python the installer puts in, and uploads it
# as the "requirements-lock" artifact. To use it: Actions > Lock the
# installer's packages > Run workflow, download the artifact, put the file in
# packaging/windows/ and check it in before running packaging/release.py.
# Each version tag makes one too, as a record of what was current then.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  lock:
    name: Lock (Windows, Python 3.13)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Make requirements-lock.txt
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python packaging/lock.py --out requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # The file works: every pinned package installs with its hash checked,
      # in a fresh environment, then ZPDF from the folder as install.ps1 does.
      - name: Check it installs with --require-hashes
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\check"
          $py = "$env:RUNNER_TEMP\check\Scripts\python.exe"
          & $py -m pip install --disable-pip-version-check -q --no-deps --require-hashes -r requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $py -m pip install --disable-pip-version-check -q --no-deps --no-build-isolation --no-index .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $py -I -c "import pdfmanager, webview, rapidocr, onnxruntime; print('ZPDF', pdfmanager.__version__)"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: requirements-lock
          path: requirements-lock.txt
          if-no-files-found: error
