name: Build app

# Builds the double-click app. Runs when the packaging changes, on version
# tags (v1.2.3) and on demand from the Actions tab. Download the result from
# the run's "Artifacts" section.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "pdfmanager/gui.py"
      - "pdfmanager/gui.html"
      - "pyproject.toml"
      - ".github/workflows/build-app.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    # (with PC_RUNNER, see tests.yml, these wait for GitHub's machines;
    # releases are built on the PC by packaging/release.py anyway)
    if: vars.PC_RUNNER != 'true' || github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: macos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
          libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
          libxcb-randr0 libxcb-render-util0 libxcb-image0 libnss3 libxcomposite1
          libxdamage1 libxrandr2 libxtst6 libxkbfile1
      - name: Install
        shell: bash
        run: |
          python -m pip install -e ".[build]"
          if [ "$RUNNER_OS" = "Linux" ]; then python -m pip install "pywebview[qt]"; fi
      - name: Build
        run: python packaging/build_app.py
      - name: Self-test the built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\ZPDF\ZPDF.exe" `
               -ArgumentList "--self-test", "$env:RUNNER_TEMP\selftest.txt" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\selftest.txt"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Self-test the built app (Linux)
        if: runner.os == 'Linux'
        run: |
          "dist/ZPDF/ZPDF" --self-test "$RUNNER_TEMP/selftest.txt" || status=$?
          cat "$RUNNER_TEMP/selftest.txt"
          exit ${status:-0}
      - name: Build Linux .deb package
        if: runner.os == 'Linux'
        run: python packaging/build_linux.py --deb
      - name: Patch Info.plist, self-test, and build macOS .dmg
        if: runner.os == 'macOS'
        run: |
          python packaging/build_macos.py
          "dist/ZPDF.app/Contents/MacOS/ZPDF" --self-test "$RUNNER_TEMP/selftest.txt" || status=$?
          cat "$RUNNER_TEMP/selftest.txt"
          exit ${status:-0}
      - name: Publish Linux and macOS assets to ZPDF-releases (on version tag)
        if: startsWith(github.ref, 'refs/tags/v') && (runner.os == 'Linux' || runner.os == 'macOS')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          LABEL: ${{ matrix.label }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASES_TOKEN not configured; skipping release upload"
            exit 0
          fi
          python - <<'PY'
          import hashlib, os, shutil, subprocess
          from pathlib import Path
          import pdfmanager

          ver = pdfmanager.__version__
          tag = f"v{ver}"
          label = os.environ["LABEL"]
          dist = Path("dist")
          files = []

          # Versioned zip + sha256 matching update.py release_asset_candidates()
          src_zip = dist / f"ZPDF-{label}.zip"
          if src_zip.is_file():
              ver_zip = dist / f"ZPDF-{ver}-{label}.zip"
              shutil.copyfile(src_zip, ver_zip)
              sha = hashlib.sha256(ver_zip.read_bytes()).hexdigest()
              ver_sha = dist / f"ZPDF-{ver}-{label}.zip.sha256"
              ver_sha.write_text(f"{sha}  {ver_zip.name}\n", encoding="ascii")
              files.extend([ver_zip, ver_sha])

          # Platform installers (.deb on Linux, .dmg on macOS) + their .sha256
          for pat in (f"zpdf_{ver}_*.deb", f"zpdf_{ver}_*.deb.sha256",
                      f"ZPDF-{ver}-macos.dmg", f"ZPDF-{ver}-macos.dmg.sha256"):
              for p in sorted(dist.glob(pat)):
                  if p not in files:
                      files.append(p)

          # Optional Ed25519 signatures when RELEASE_SIGNING_KEY is configured
          sig_key = os.environ.get("RELEASE_SIGNING_KEY", "").strip()
          if sig_key:
              from pdfmanager import relsign
              for p in list(files):
                  if p.name.endswith(".sha256"):
                      sig_path = p.with_name(p.name[:-7] + ".sig")
                      sig_path.write_text(relsign.sign_checksum(p.read_bytes(), sig_key), encoding="ascii")
                      files.append(sig_path)

          if not files:
              raise SystemExit("No platform release assets found to upload")
          cmd = ["gh", "release", "upload", tag, *(str(p) for p in files),
                 "-R", "Tempura-446/ZPDF-releases", "--clobber"]
          print("Uploading:", [p.name for p in files])
          subprocess.run(cmd, check=True)
          PY
      # On pull requests the zip is only a by-product of checking the build, so
      # keep it briefly and don't fail the check if the storage quota is full.
      - uses: actions/upload-artifact@v7
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          name: ZPDF-${{ matrix.label }}
          path: |
            dist/ZPDF-${{ matrix.label }}.zip
            dist/zpdf_*.deb
            dist/zpdf_*.deb.sha256
            dist/ZPDF-*-macos.dmg
            dist/ZPDF-*-macos.dmg.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 90 }}
