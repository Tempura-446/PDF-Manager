name: Build app

# Builds the double-click app. Runs when the packaging changes, on version
# tags (v1.2.3) and on demand from the Actions tab. Download the result from
# the run's "Artifacts" section.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "pdfmanager/gui.py"
      - "pdfmanager/gui.html"
      - "pyproject.toml"
      - ".github/workflows/build-app.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: ubuntu-latest
            label: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
          libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
          libxcb-randr0 libxcb-render-util0 libxcb-image0 libnss3 libxcomposite1
          libxdamage1 libxrandr2 libxtst6 libxkbfile1
      - name: Install
        shell: bash
        run: |
          python -m pip install -e ".[build]"
          if [ "$RUNNER_OS" = "Linux" ]; then python -m pip install "pywebview[qt]"; fi
      - name: Build
        run: python packaging/build_app.py
      - name: Self-test the built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\ZPDF\ZPDF.exe" `
               -ArgumentList "--self-test", "$env:RUNNER_TEMP\selftest.txt" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\selftest.txt"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Self-test the built app (Linux)
        if: runner.os == 'Linux'
        run: |
          "dist/ZPDF/ZPDF" --self-test "$RUNNER_TEMP/selftest.txt" || status=$?
          cat "$RUNNER_TEMP/selftest.txt"
          exit ${status:-0}
      - uses: actions/upload-artifact@v4
        with:
          name: ZPDF-${{ matrix.label }}
          path: dist/ZPDF-${{ matrix.label }}.zip
          if-no-files-found: error
